<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать лицензию — SK Aesthetics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAF8F5; /* Цвет фона, как на сайте */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon {
            font-size: 3rem;
            color: #C9A96E; /* Золотой цвет из сайта */
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #1A1A1A;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: #6B6B6B;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-download {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            background: linear-gradient(135deg, #C9A96E, #A0824D);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(201, 169, 110, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(201, 169, 110, 0.4);
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #C9A96E;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #A0824D;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="icon">📄</span>
        <h1>Лицензия на медицинскую деятельность</h1>
        <p>Нажмите на кнопку ниже, чтобы скачать официальный PDF-файл лицензии SK Aesthetics.</p>
        
        <!-- Ссылка на скачивание файла. Убедись, что файл license.pdf лежит рядом в папке -->
        <a href="license.pdf" download="Лицензия_SK_Aesthetics.pdf" class="btn-download">
            ⬇️ Скачать лицензию (PDF)
        </a>

        <a href="/" class="back-link">← Вернуться на главную</a>
    </div>

</body>
</html>
